<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="ShopSphere request flow from browsers to Next.js to Laravel, PostgreSQL, payment gateway and delivery worker"><rect width="1200" height="310" rx="18" fill="#0d1731"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#99a6e6"/></marker></defs><style>text{font-family:Arial,sans-serif}.label{font-weight:700;font-size:17px;fill:#f0f3ff}.sub{font-size:12px;fill:#b7c3e4}.edge{fill:none;stroke:#99a6e6;stroke-width:2.5;marker-end:url(#arrow)}@keyframes run{to{stroke-dashoffset:-36}}.edge{stroke-dasharray:8 5;animation:run 3s linear infinite}@media(prefers-reduced-motion:reduce){.edge{animation:none}}</style>
