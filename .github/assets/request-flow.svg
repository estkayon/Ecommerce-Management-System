<g><rect x="800" y="118" width="175" height="79" rx="12" fill="#202e55" stroke="#6f82bf"/><text x="887" y="151" text-anchor="middle" class="label">SSLCommerz</text><text x="887" y="173" text-anchor="middle" class="sub">Sandbox gateway</text></g>
